<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리자 | 비어플 B.a.f</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css?v=4">
</head>
<body class="admin-body">

<!-- ===== 로그인 화면 ===== -->
<section id="loginView" class="login-view" hidden>
  <form id="loginForm" class="login-card">
    <img class="login-logo" src="assets/logo-wordmark.png" alt="B.a.f" width="149" height="42">
    <h1 class="login-title">관리자 로그인</h1>
    <label class="field">
      <span>이메일</span>
      <input type="email" id="loginEmail" autocomplete="username" required>
    </label>
    <label class="field">
      <span>비밀번호</span>
      <input type="password" id="loginPassword" autocomplete="current-password" required>
    </label>
    <p id="loginError" class="form-error" hidden></p>
    <button type="submit" class="btn btn--primary" id="loginBtn">로그인</button>
  </form>
</section>

<!-- ===== 대시보드 ===== -->
<section id="dashView" class="dash-view" hidden>
  <header class="admin-top">
    <div class="admin-brand">
      <img src="assets/logo-wordmark.png" alt="B.a.f" width="130" height="37">
      <span class="admin-brand-label">관리자 페이지</span>
    </div>
    <div class="admin-top-right">
      <span id="userEmail" class="user-email"></span>
      <button type="button" class="btn btn--ghost btn--sm" id="logoutBtn">로그아웃</button>
    </div>
  </header>

  <nav class="admin-tabs">
    <button type="button" class="admin-tab is-active" data-tab="notices">공지사항</button>
    <button type="button" class="admin-tab" data-tab="materials">자료실</button>
    <button type="button" class="admin-tab" data-tab="faqs">FAQ</button>
  </nav>

  <!-- ----- 공지사항 탭 ----- -->
  <div class="tab-panel" id="tab-notices">
    <div class="admin-grid">
      <!-- 폼 -->
      <div class="card form-card">
        <h2 id="noticeFormTitle">새 공지</h2>
        <form id="noticeForm">
          <input type="hidden" id="noticeId">
          <label class="field">
            <span>태그</span>
            <input type="text" id="noticeTag" placeholder="예: 필독, New, 25-2학기">
          </label>
          <label class="field">
            <span>제목 *</span>
            <input type="text" id="noticeTitle" required>
          </label>
          <label class="check">
            <input type="checkbox" id="noticePinned">
            <span>상단 고정 (pinned)</span>
          </label>
          <label class="field">
            <span>본문 *</span>
            <textarea id="noticeBody" rows="10" required></textarea>
          </label>
          <div class="form-actions">
            <button type="submit" class="btn btn--primary btn--sm">저장</button>
            <button type="button" class="btn btn--ghost btn--sm" id="noticeReset">새로 작성</button>
          </div>
          <p class="form-error" id="noticeError" hidden></p>
        </form>
      </div>
      <!-- 목록 -->
      <div class="card list-card">
        <h2>공지 목록 (<span id="noticeCount">0</span>)</h2>
        <div class="admin-list" id="noticeList"></div>
      </div>
    </div>
  </div>

  <!-- ----- 자료실 탭 ----- -->
  <div class="tab-panel" id="tab-materials" hidden>
    <div class="admin-grid">
      <!-- 폼 -->
      <div class="card form-card">
        <h2 id="materialFormTitle">새 자료</h2>
        <form id="materialForm">
          <input type="hidden" id="materialId">
          <input type="hidden" id="materialFileUrl">
          <input type="hidden" id="materialFileName">
          <label class="field">
            <span>분류 *</span>
            <select id="materialType" required>
              <option value="edu">교육자료</option>
              <option value="project">프로젝트</option>
            </select>
          </label>
          <label class="field">
            <span>제목 *</span>
            <input type="text" id="materialTitle" required>
          </label>
          <label class="field">
            <span>설명</span>
            <textarea id="materialDesc" rows="3"></textarea>
          </label>
          <label class="field">
            <span>작성자</span>
            <input type="text" id="materialAuthor" placeholder="예: 13 이동현">
          </label>
          <label class="field">
            <span>날짜</span>
            <input type="date" id="materialDate">
          </label>
          <label class="field">
            <span>태그 (콤마로 구분)</span>
            <input type="text" id="materialTags" placeholder="예: R, Textmining, 입문">
          </label>
          <label class="field">
            <span>파일</span>
            <input type="file" id="materialFile">
            <small class="file-current" id="materialFileCurrent"></small>
          </label>
          <div class="form-actions">
            <button type="submit" class="btn btn--primary btn--sm" id="materialSubmit">저장</button>
            <button type="button" class="btn btn--ghost btn--sm" id="materialReset">새로 작성</button>
          </div>
          <p class="form-error" id="materialError" hidden></p>
        </form>
      </div>
      <!-- 목록 -->
      <div class="card list-card">
        <h2>자료 목록 (<span id="materialCount">0</span>)</h2>
        <div class="admin-list" id="materialList"></div>
      </div>
    </div>
  </div>

  <!-- ----- FAQ 탭 ----- -->
  <div class="tab-panel" id="tab-faqs" hidden>
    <div class="admin-grid">
      <!-- 폼 -->
      <div class="card form-card">
        <h2 id="faqFormTitle">새 FAQ</h2>
        <form id="faqForm">
          <input type="hidden" id="faqId">
          <label class="field">
            <span>질문 *</span>
            <input type="text" id="faqQuestion" required>
          </label>
          <label class="field">
            <span>답변 *</span>
            <textarea id="faqAnswer" rows="5" required></textarea>
          </label>
          <div class="form-actions">
            <button type="submit" class="btn btn--primary btn--sm">저장</button>
            <button type="button" class="btn btn--ghost btn--sm" id="faqReset">새로 작성</button>
          </div>
          <p class="form-error" id="faqError" hidden></p>
        </form>
      </div>
      <!-- 목록 -->
      <div class="card list-card">
        <h2>FAQ 목록 (<span id="faqCount">0</span>)</h2>
        <div class="admin-list" id="faqList"></div>
      </div>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js?v=1"></script>
<script src="admin.js?v=2"></script>
</body>
</html>
